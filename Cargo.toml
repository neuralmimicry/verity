[package]
name = "verity"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Evaluation contracts and isolated evidence worker for NeuralMimicry"
[workspace]
members = ["crates/workflow-core"]
[dependencies]
nm-workflow-core = { path = "crates/workflow-core" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

